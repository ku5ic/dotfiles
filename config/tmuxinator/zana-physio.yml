name: ZanaPhysio
root: ~/Projects/ZanaKadric/Code/ZanaPhysio/
enable_pane_titles: true

windows:
  - editor:
      layout: main-horizontal
      panes:
        - nvim:
            - nvim
        - root:
  - claude:
      panes:
        - claude
  - localhost:
      layout: even-horizontal
      panes:
        - backend:
            - cd backend
            - clear
            - uv run manage.py runserver
        - frontend:
            - cd frontend
            - clear
            - npm run dev
  - tests:
      layout: even-horizontal
      panes:
        - backend:
            - cd backend
            - clear
            - make test-unit-watch
        - frontend:
            - cd frontend
            - clear
            - npm run test:watch
