# Login shell. Forced to Homebrew zsh so panes inherit the same environment
# as the desktop terminal regardless of /etc/shells ordering.
set -g default-shell /opt/homebrew/bin/zsh
set -g default-command /opt/homebrew/bin/zsh

# Sync the UPTERM_ADMIN_SOCKET environment variable from the host terminal to tmux
set -ga update-environment " UPTERM_ADMIN_SOCKET"

# Terminal capabilities
set -g default-terminal "tmux-256color"

# Truecolor (RGB), OSC 8 hyperlinks (WezTerm renders them as clickable links),
# sixel and kitty graphics passthrough (image.nvim, chafa; needs
# allow-passthrough), and undercurl + coloured underscores for LSP diagnostics.
set -as terminal-features ",*:RGB:hyperlinks:sixel:graphics:usstyle"

# Extended (CSI-u) keys are off intentionally. Re-enabling broke something
# previously; revisit before flipping. The features advert is preserved so
# apps can still ask for extkeys when this gets turned back on.
set -s extended-keys off #!important
set -as terminal-features 'xterm*:extkeys'

# Let image escape sequences (sixel, kitty graphics) reach the host terminal.
# Tradeoff: untrusted output piped through tmux can emit arbitrary escape
# sequences. Acceptable for an interactive dev session, not for log piping.
set -g allow-passthrough on

# Forward focus-in/out events so Neovim's autoread and similar features fire.
set -g focus-events on


# General behaviour
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000
set -g set-clipboard on
set -g mouse on
set -g display-time 4000
setw -g aggressive-resize on
setw -g main-pane-width 50%
setw -g main-pane-height 70%

# Silence every form of bell/activity notification. Status-bar flashing on a
# busy build pane is noise.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Pane borders. Empty format with status row produces a thin coloured bar at
# the bottom of each pane that doubles as the active-pane indicator; catppuccin
# supplies the border colours.
set -g pane-border-format ""
set -g pane-border-status bottom


# Prefix and mode. C-a is closer than C-b on a US keyboard; double-tap sends
# the literal C-a through to the underlying app.
unbind C-b
set -g prefix C-a
bind a send-prefix
set -g mode-keys vi


# Window and pane bindings
bind C-a last-window
bind C-p previous-window
bind C-n next-window
bind p paste-buffer
bind R run-shell "tmux source-file ~/.config/tmux/tmux.conf > /dev/null; tmux display-message 'Sourced ~/.config/tmux/tmux.conf!'"

# Splits and new windows inherit the active pane's working directory; the
# tmux defaults (prefix + %, ", c) start in $HOME instead.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix + s: fzf popup over other live sessions. Enter switches at whatever
# level the cursor sits on (session, window, or pane); right arrow drills in
# one level, left arrow backs out - same shape as tmux's own choose-tree.
bind s display-popup -E -w 95% -h 90% "$HOME/.dotfiles/scripts/tmux_session_picker.sh"

# Resize panes with prefix + H/J/K/L. -r makes them repeatable within
# repeat-time (500ms), so `prefix H H H` keeps resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix + Y: dump current window layout to macOS clipboard
bind Y run-shell "tmux display-message -p '#{window_layout}' | pbcopy"


# Copy mode. Strip ANSI colour codes before sending to the macOS clipboard so
# pasted text isn't littered with escape sequences.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sed 's/\x1b\[[0-9;]*m//g' | pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "sed 's/\x1b\[[0-9;]*m//g' | pbcopy"


# vim-tmux-navigator (tmux side inlined, the plugin is not loaded): pass
# C-hjkl + C-\ to vim/nvim/fzf when the pane runs one of them, otherwise move
# between tmux panes. A format match on the foreground command, so no process
# is forked per keypress; vim started via a wrapper script is not detected.
%hidden is_vim='#{m/ri:^g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}'
bind -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if -F "$is_vim" "send-keys 'C-\\'" 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l
# prefix + C-l clears the screen, since bare C-l now moves panes.
bind C-l send-keys C-l


# Reapply main-horizontal layout proportions after every session switch.
# client-session-changed fires for both switch-client (inside tmux) and
# attach-session (outside tmux). The 0.1s delay lets the client resize event
# propagate before select-layout recalculates main-pane-height.
set-hook -g client-session-changed 'run-shell -b -d 0.1 "$HOME/.dotfiles/scripts/tmux_reapply_layouts.sh #{session_name}"'


# Plugins (managed by tpm; install with prefix + I)
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'fcsonline/tmux-thumbs'

# tmux-thumbs: prefix + Space hints over visible URLs/paths/hashes/IPs.
# Lowercase hint copies via pbcopy; uppercase hint opens via macOS `open`
# (URLs to default browser, files to associated app). Both route through the
# handler so a target lifted from prose sheds its wrapping punctuation.
#
# tmux-thumbs substitutes {} with a bare ${THUMB} reference and eval's the
# result, so the quotes below are load-bearing: without them a captured path
# containing a space is word-split before the handler ever sees it.
set -g @thumbs-command "$HOME/.dotfiles/scripts/tmux_thumb_upcase_handler.sh --print \"{}\" | pbcopy"
set -g @thumbs-upcase-command "$HOME/.dotfiles/scripts/tmux_thumb_upcase_handler.sh \"{}\""

# Catppuccin theme inputs, read when tpm sources the plugin below.
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_status_background "#242638"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_date_time_text " %d/%m/%y %H:%M"
# Status modules as separate pills, rounded on both ends like the window tabs.
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"

# tpm init. TPM sources every plugin's *.tmux file synchronously inside this
# call, so anything that overrides a plugin default or reads a variable a
# plugin emits has to come after it.
# Pinned: with this file under ~/.config/tmux, tpm would otherwise clone plugins
# into ~/.config/tmux/plugins, which is a symlink into the dotfiles repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run '/opt/homebrew/opt/tpm/share/tpm/tpm'


# Status bar. status-right expands catppuccin's emitted variables at set time.
set -g status-interval 1
set -g status-keys emacs
set -g status-left ""
set -g status-right-length 100
set -gF status-right "#{@catppuccin_status_directory}#{@catppuccin_status_session}#{@catppuccin_status_host}#{E:@catppuccin_status_date_time}"

# Two-line status with the bar on the lower line, leaving an empty spacer row
# between the panes and the bar; fill=terminal keeps the spacer from taking the
# status background. Reset first so re-sourcing doesn't copy the already-emptied
# line 0.
set -g status 2
run-shell 'tmux set -gu status-format && tmux set -g status-format[1] "$(tmux show -gv "status-format[0]")" && tmux set -g status-format[0] "#[fill=terminal]"'

# Darken inactive panes one step below the terminal background (frappe mantle);
# a fg-only dim is invisible since most apps paint their own text colours.
set -g window-style "bg=#292c3c"
set -g window-active-style "bg=terminal"

# Arrows on the border point at the active pane; popups match the rounded tabs.
setw -g pane-border-indicators arrows
set -g popup-border-lines rounded

# Catppuccin sets message-style/message-command-style with align=centre and no
# fill=, so the message/command-prompt background is only ever a pill sized to
# the text. fill= (not bg=) is what extends the background across the row (see
# STYLES in tmux(1)).
set -g message-style "fg=#94e2d5,bg=#242638,fill=#242638,align=left"
set -g message-command-style "fg=#94e2d5,bg=#242638,fill=#242638,align=left"
