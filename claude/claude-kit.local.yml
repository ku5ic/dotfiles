# Personal overlay for claude-kit's kit.yml, linked to
# ~/.claude/claude-kit.local.yml by install.sh. Merged over kit.yml: maps
# merge and arrays append, so this can add to the kit but never remove.

# The Brewfile pins tools for every project.
user_pins: [~/.dotfiles/Brewfile]

# Required every session: chat replies and terminal drafts never pass a file gate.
global_skills: [slop-patterns]

# A clause, a colon, then a reveal or restatement. No published source names
# it; it's a personal rule (claude-kit investigation, 2026-11-10). The match
# needs the sentence to end after the colon with no comma, semicolon, code
# span, or parenthesis, so an inline list ("in this order: a, b, c") passes.
# That cut the kit docs' hits from 143 to 58.
slop:
  rules:
    - id: joining-colon
      tier: 2
      match: '\b[a-z]+ [a-z]+ [a-z]+: [a-z][^,;:\n`(]*[.!?](\s|$)'
      fix: two sentences, or a comma

