# Personal overlay for claude-kit's kit.yml, linked to
# ~/.claude/claude-kit.local.yml by bootstrap.sh. Merged over kit.yml: maps
# merge and arrays append, so this can add to the kit but never remove.

stacks:
  dotfiles:
    sentinels:
      - name: Brewfile
        anchor: true
    skills: [bash-patterns]

# Runs with run-checks.sh, alongside /code-review; the Stop hook's
# file-scoped shellcheck comes from kit.yml. run-checks.sh splits cmd into
# words without glob expansion, so find does the matching. bats stays in CI:
# the suite takes minutes.
toolchain_checks:
  - stack: dotfiles
    name: shellcheck
    bin: [shellcheck]
    cmd: "find claude-kit/bin claude-kit/hooks claude-kit/install-rules.sh -name *.sh -exec {bin} -x -P SCRIPTDIR {} +"
