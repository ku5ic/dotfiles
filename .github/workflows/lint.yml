name: lint

# claude-kit has its own CI in ku5ic/claude-kit; this covers the dotfiles' own scripts.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: shellcheck
        # completions/ are zsh, which shellcheck can't parse.
        run: find scripts macos install.sh -name '*.sh' -exec shellcheck -S warning -x -P SCRIPTDIR {} +

      - name: bats
        run: bats tests/
