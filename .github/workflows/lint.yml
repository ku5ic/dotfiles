name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR claude-kit/bin/*.sh claude-kit/hooks/*.sh claude-kit/install-rules.sh

      - name: bats
        run: bats claude-kit/tests/ tests/

      - name: doctor
        run: CI=true bash claude-kit/bin/doctor.sh
